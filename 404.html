<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#242528">
  <title>Page not found | Ammar Khandoker</title>
  <style>
    :root{color-scheme:dark;--bg:#242528;--panel:#2b2c30;--line:rgba(255,255,255,.13);--text:#fafafa;--muted:#c8c9ce;--green:#4fe2a0}
    *{box-sizing:border-box}
    body{display:grid;min-height:100vh;margin:0;place-items:center;padding:24px;background:radial-gradient(circle at 75% 10%,rgba(79,226,160,.11),transparent 32%),var(--bg);color:var(--text);font:16px/1.6 Inter,Arial,sans-serif}
    main{width:min(660px,100%);padding:clamp(28px,6vw,58px);border:1px solid var(--line);border-radius:23px;background:rgba(43,44,48,.9);text-align:center}
    .brand{display:inline-block;margin-bottom:26px;color:var(--text);font:700 1.55rem/1 'Space Grotesk',Arial,sans-serif;letter-spacing:-.06em;text-decoration:none}.brand span{color:var(--green)}
    .code{margin:0;color:var(--green);font-size:.8rem;font-weight:800;letter-spacing:.18em}
    h1{margin:11px 0 12px;font:700 clamp(2.5rem,9vw,4.5rem)/1.05 'Space Grotesk',Arial,sans-serif;letter-spacing:-.05em}
    p{max-width:470px;margin:0 auto;color:var(--muted)}
    .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:11px;margin-top:29px}
    .btn{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:11px 18px;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:.86rem;font-weight:700;text-decoration:none}
    .btn.primary{border-color:var(--green);background:var(--green);color:#17221d}
    .btn:focus-visible{outline:3px solid #9becc4;outline-offset:4px}
    @media(max-width:480px){.actions{flex-direction:column}.btn{width:100%}}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/">AMMAR<span>.</span></a>
    <p class="code">ERROR 404</p>
    <h1>Page not found.</h1>
    <p>The page may have moved, the link may be outdated, or the address may be incorrect. Head back to the portfolio to find the right section.</p>
    <div class="actions">
      <a class="btn primary" href="/">Back to home</a>
      <a class="btn" href="/#projects">Explore projects</a>
      <a class="btn" href="/#contact">Contact</a>
    </div>
  </main>
</body>
</html>
